<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title data-rt="title">Fixture</title><link rel="stylesheet" href="/_astro/fixture.css"><script type="module" src="/_astro/fixture.js"></script></head><body><main><h1>Contact</h1>
<div class="rt-summary" id="form-summary" role="alert" tabindex="-1" data-rt="summary" hidden><p class="rt-summary-title" id="form-summary-title" data-rt="summary-title"></p><ul data-rt="summary-items"></ul></div>
<form class="rt-form contact-form" action="/api/lead.php" method="post" data-lead data-thanks="/kontakt/danke/">
<div class="rt-field" data-field="name"><label for="f-name">Name</label><input class="rt-input" id="f-name" name="name" type="text" required autocomplete="name" aria-describedby="f-name-err" data-rt-field="name"><p class="rt-error" id="f-name-err" data-rt-error="name" hidden></p></div>
<div class="rt-field" data-field="email"><label for="f-email">E-Mail</label><input class="rt-input" id="f-email" name="email" type="email" required autocomplete="email" aria-describedby="f-email-hint f-email-err" data-rt-field="email"><p class="rt-error" id="f-email-err" data-rt-error="email" hidden></p></div>
<div class="rt-field" data-field="company"><label for="f-company">Firma</label><input class="rt-input" id="f-company" name="company" type="text" required autocomplete="organization" aria-describedby="f-company-err" data-rt-field="company"><p class="rt-error" id="f-company-err" data-rt-error="company" hidden></p></div>
<div class="rt-field" data-field="topic"><label for="f-topic">Anliegen</label><select class="rt-input" id="f-topic" name="topic" required autocomplete="off" aria-describedby="f-topic-err" data-rt-field="topic"><option value="">Please choose</option><option value="demo" data-rt-option="demo">Demo</option><option value="enterprise" data-rt-option="enterprise">Enterprise</option><option value="security" data-rt-option="security">Security and privacy</option><option value="other" data-rt-option="other">Other</option></select><p class="rt-error" id="f-topic-err" data-rt-error="topic" hidden></p></div>
<div class="rt-field" data-field="message"><label for="f-message">Nachricht</label><textarea class="rt-input" id="f-message" name="message" rows="6" autocomplete="off" aria-describedby="f-message-err" data-rt-field="message"></textarea><p class="rt-error" id="f-message-err" data-rt-error="message" hidden></p></div>
<input type="hidden" name="lang" value="en"><div class="contact-trap" aria-hidden="true"><label for="f-website">x</label><input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
<button type="submit">Senden</button></form></main></body></html>
