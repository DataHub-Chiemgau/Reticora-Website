# Virtueller Host wie beim Hoster: Webroot mit AllowOverride All, die Regeln stehen in den .htaccess-Dateien aus dist/
# und in api/.htaccess (backend/public/.htaccess). Alles außerhalb des Webroots ist nicht erreichbar.
ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory />
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html>
        AllowOverride All
        Options FollowSymLinks
        Require all granted
    </Directory>
    DirectoryIndex index.html index.php
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log "%h %t \"%r\" %>s %b %D"
</VirtualHost>
