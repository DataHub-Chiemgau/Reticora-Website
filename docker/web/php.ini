; Wie im Betrieb erwartet: keine Fehler im Browser, keine PHP-Version in den Kopfzeilen.
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
expose_php = Off
; Absichtlich nicht UTC: das Backend rechnet überall mit gmdate(); eine abweichende Zeitzone deckt Fehler auf.
date.timezone = Europe/Berlin
; Systemzertifikate (dort ist die Test-CA eingetragen, siehe entrypoint.sh); keine abgeschaltete Prüfung.
openssl.cafile = /etc/ssl/certs/ca-certificates.crt
