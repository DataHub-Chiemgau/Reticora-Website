name: security.txt-Ablauf

# Warnt, bevor das Ablaufdatum der security.txt (RFC 9116) näher als 30 Tage rückt.
# Ohne Meldeadresse (SITE.securityContact) gibt es keine Datei; dann endet der Lauf mit einem Hinweis.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-txt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # kein Push in diesem Lauf: GITHUB_TOKEN nicht in .git/config ablegen (S-10)
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-security-txt.mjs
        env:
          # Optional: öffentliche Adresse der ausgelieferten Datei als Repository-Variable (keine Secrets).
          SECURITY_TXT_URL: ${{ vars.SECURITY_TXT_URL }}
