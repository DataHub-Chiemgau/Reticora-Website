  - region "So erkennt der Collector ein Gerät":
    - heading "So erkennt der Collector ein Gerät" [level=2]
    - paragraph:
      - text: "Für jedes gefundene Gerät geht der Collector in fester Reihenfolge vor: zuerst die Antwort auf SNMP (sysObjectID und Beschreibung), dann Redfish (Hersteller und Modell des Server-Controllers), dann das Banner eines Dienstes wie SSH. Dazu nimmt er die Herstellerkennung aus der MAC-Adresse. Das erste passende Profil legt Typ, Hersteller und Modell fest."
      - group: "Beleg : Klassifikation"
    - link "Protokolle und Ablauf der Discovery":
      - /url: /produkt/discovery/
  - region "Was mit unbekannten Geräten geschieht":
    - heading "Was mit unbekannten Geräten geschieht" [level=2]
    - paragraph:
      - text: Passt kein Profil, legt Reticora das Gerät trotzdem an, als generisches Gerät. Den Hersteller nennt die MAC-Adresse, und in der Review-Inbox wartet ein Review „Unklassifiziertes Gerät“. Sie setzen den Typ am CI und erledigen das Review.
      - group: "Beleg : Klassifikation"
      - group: "Beleg : Arten von Reviews"
      - text: Ein generisches Gerät hebt die Discovery später auf einen bestimmten Typ; einen anderen Typ, etwa den, den Sie gesetzt haben, ändert sie nie.
      - group: "Beleg : Typ eines unbekannten Geräts"
  - region "Profile ergänzen":
    - heading "Profile ergänzen" [level=2]
    - paragraph:
      - text: "Ein Profil ist eine beschreibende Datei: woran ein Gerät zu erkennen ist und welche Werte der Collector abfragt. Zusätzliche oder geänderte Profile lädt der Collector aus einem Verzeichnis, ohne dass Sie auf eine neue Version warten."
      - group: "Beleg : Erweiterbare Geräteprofile"
      - text: Fehlt Ihnen eine Familie, schreiben Sie uns.
    - link "Kontakt":
      - /url: /kontakt/
