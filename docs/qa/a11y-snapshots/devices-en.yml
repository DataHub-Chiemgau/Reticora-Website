  - region "How the collector recognizes a device":
    - heading "How the collector recognizes a device" [level=2]
    - paragraph:
      - text: "For every device it finds, the collector works in a fixed order: first the SNMP response (sysObjectID and description), then Redfish (vendor and model of the server controller), then the banner of a service such as SSH. It also takes the vendor prefix from the MAC address. The first matching profile sets type, vendor and model."
      - group: "Evidence : Classification"
    - link "Protocols and discovery workflow":
      - /url: /en/product/discovery/
  - region "What happens to unknown devices":
    - heading "What happens to unknown devices" [level=2]
    - paragraph:
      - text: If no profile matches, Reticora still creates the device, as a generic device. The MAC address names the vendor, and an “Unclassified device” review waits in the review inbox. You set the type on the CI and resolve the review.
      - group: "Evidence : Classification"
      - group: "Evidence : Kinds of reviews"
      - text: Discovery later raises a generic device to a specific type; it never changes any other type, such as one you set.
      - group: "Evidence : Type of an unknown device"
  - region "Adding profiles":
    - heading "Adding profiles" [level=2]
    - paragraph:
      - text: "A profile is a declarative file: how to recognize a device and which values the collector queries. The collector loads additional or changed profiles from a directory, without you waiting for a new release."
      - group: "Evidence : Extensible device profiles"
      - text: Missing a device family? Let us know.
    - link "Contact":
      - /url: /en/contact/
