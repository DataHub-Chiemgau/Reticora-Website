- main:
  - region "Was hängt woran, und was fällt mit aus?":
    - heading "Was hängt woran, und was fällt mit aus?" [level=1]
    - paragraph:
      - text: Reticora leitet aus den Beobachtungen ab, wie Ihre Geräte verbunden und versorgt sind. Daraus rechnet die Ausfallsimulation, welche CIs, Kunden und Standorte ein Ausfall trifft.
      - group: "Beleg : Nachbarschaften aus LLDP"
      - group: "Beleg : Auswirkungsanalyse"
    - link "Live-Demo":
      - /url: /demo/
    - link "30 Tage testen":
      - /url: https://www.reticora.cloud/onboarding
    - paragraph: Angebot nur für Unternehmen.
