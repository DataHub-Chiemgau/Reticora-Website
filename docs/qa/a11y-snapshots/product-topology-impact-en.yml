- main:
  - region "What depends on what, and what goes down with it?":
    - heading "What depends on what, and what goes down with it?" [level=1]
    - paragraph:
      - text: From the observations Reticora derives how your devices are connected and powered. From that, the outage simulation calculates which CIs, customers and sites an outage hits.
      - group: "Evidence : Neighbors from LLDP"
      - group: "Evidence : Impact analysis"
    - link "Live demo":
      - /url: /en/demo/
    - link "Try for 30 days":
      - /url: https://www.reticora.cloud/onboarding
    - paragraph: Offer for businesses only.
  - navigation "Product":
