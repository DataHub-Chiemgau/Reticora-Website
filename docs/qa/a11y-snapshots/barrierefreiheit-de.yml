- main:
  - region "Barrierefreiheit dieser Website":
    - heading "Barrierefreiheit dieser Website" [level=1]
    - paragraph: Hier steht, was wir an dieser Website prüfen, mit welchem Ergebnis und wo es Grenzen gibt. Die Angaben gelten für die Website, nicht für die Anwendung Reticora.
    - paragraph: "Stand: 12. November 2026"
  - region "Wie wir prüfen":
    - heading "Wie wir prüfen" [level=2]
    - list:
      - listitem:
        - text: "Jede Seite wird bei jeder Änderung automatisch mit axe-core geprüft. Stand heute: ohne Befund."
        - group: "Beleg : Automatische Prüfung mit axe-core"
      - listitem:
        - text: "Mit der Tastatur geprüft und bedienbar: das Menü, die aufklappbaren Belege, die Ausfallsimulation und das Kontaktformular."
        - group: "Beleg : Bedienung mit der Tastatur"
      - listitem: Die Ausfallsimulation hat zusätzlich zu den Punkten im Schema einen Umschaltknopf je CI und eine Ergebniszeile, die Screenreader vorlesen.
  - region "Kontraste":
    - heading "Kontraste" [level=2]
    - paragraph:
      - text: "Die Farben sind so gewählt, dass Text mindestens das Kontrastverhältnis 4,5 : 1 und Umrisse von Bedienelementen mindestens 3 : 1 erreichen. Die Werte sind nach der Formel der WCAG 2 berechnet."
      - group: "Beleg : Kontrastverhältnisse dieser Website"
    - region "Kontrastverhältnisse nach Farbthema":
      - table:
        - rowgroup:
          - row "Paar dunkles Thema „Leitstand“ helles Thema „Dokument“ Mindestwert":
            - columnheader "Paar"
            - columnheader "dunkles Thema „Leitstand“"
            - columnheader "helles Thema „Dokument“"
            - columnheader "Mindestwert"
        - rowgroup:
          - 'row "Text auf Seitengrund 16,0 : 1 15,7 : 1 4,5 : 1"':
            - rowheader "Text auf Seitengrund"
            - 'cell "16,0 : 1"'
            - 'cell "15,7 : 1"'
            - 'cell "4,5 : 1"'
          - 'row "Vorspann und Beschreibungen auf Seitengrund 8,3 : 1 6,4 : 1 4,5 : 1"':
            - rowheader "Vorspann und Beschreibungen auf Seitengrund"
            - 'cell "8,3 : 1"'
            - 'cell "6,4 : 1"'
            - 'cell "4,5 : 1"'
          - 'row "Hinweise und Bildunterschriften auf Seitengrund 6,4 : 1 5,0 : 1 4,5 : 1"':
            - rowheader "Hinweise und Bildunterschriften auf Seitengrund"
            - 'cell "6,4 : 1"'
            - 'cell "5,0 : 1"'
            - 'cell "4,5 : 1"'
          - 'row "Akzentfarbe auf Seitengrund 9,0 : 1 5,0 : 1 4,5 : 1"':
            - rowheader "Akzentfarbe auf Seitengrund"
            - 'cell "9,0 : 1"'
            - 'cell "5,0 : 1"'
            - 'cell "4,5 : 1"'
          - 'row "Umriss von Bedienelementen auf Seitengrund 3,9 : 1 3,1 : 1 3,0 : 1"':
            - rowheader "Umriss von Bedienelementen auf Seitengrund"
            - 'cell "3,9 : 1"'
            - 'cell "3,1 : 1"'
            - 'cell "3,0 : 1"'
    - paragraph:
      - text: Die Werte stammen aus unseren Gestaltungsvorgaben und sind von uns berechnet, nicht von Dritten geprüft.
      - group: "Beleg : Kontrastverhältnisse dieser Website"
  - region "Bewegung und Darstellung":
    - heading "Bewegung und Darstellung" [level=2]
    - paragraph:
      - text: Bewegung gibt es nur als Antwort auf eine Handlung, höchstens 150 ms lang. Ist im System „Bewegung reduzieren“ eingestellt, entfällt sie ganz.
      - group: "Beleg : Bewegung höchstens 150 ms"
      - text: Im Modus „Erzwungene Farben“ (etwa dem Kontrastmodus von Windows) übernehmen Knöpfe, Netzschema und Ausfallsimulation die Systemfarben; ausgefallene und betroffene CIs bleiben unterscheidbar.
      - group: "Beleg : Erzwungene Farben"
      - text: "Farbe trägt nie allein eine Aussage: Zustände haben ein Wort, das Netzschema eine Ergebniszeile."
  - region "Bekannte Einschränkungen":
    - heading "Bekannte Einschränkungen" [level=2]
    - list:
      - listitem: Die Bilder der Anwendung sind noch Platzhalter. Jeder Platzhalter nennt in Text, was später zu sehen sein wird.
      - listitem: "Schemazeichnungen wie das Netzschema sind vereinfacht. Ihr Inhalt steht zusätzlich als Text daneben: Die Ergebniszeile nennt jedes betroffene CI beim Namen."
  - region "Hinweise an uns":
    - heading "Hinweise an uns" [level=2]
    - paragraph: "Ist Ihnen eine Barriere aufgefallen? Schreiben Sie uns: [Kontaktweg für Hinweise zur Barrierefreiheit: Angabe vom Anbieter]"
