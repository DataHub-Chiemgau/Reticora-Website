  - region "30 Tage testen":
    - heading "30 Tage testen" [level=2]
    - paragraph:
      - text: Der Test umfasst den Standard-Umfang für bis zu 100 CIs. Sie legen ein Konto an, bestätigen Ihre E-Mail-Adresse und richten bei der ersten Anmeldung eine Authenticator-App ein. Nach dem Test bleibt Ihre CMDB 30 Tage erhalten; wählen Sie bis dahin kein Paket, wird sie gelöscht.
      - group: "Beleg : Test und Downgrade"
    - link "30 Tage testen":
      - /url: https://www.reticora.cloud/onboarding
  - region "Fragen zu Preisen und Paketen":
    - heading "Fragen zu Preisen und Paketen" [level=2]
    - heading "Was zählt als CI?" [level=3]
    - paragraph:
      - text: "Ein CI ist ein Eintrag in der CMDB: ein Gerät, eine virtuelle Maschine, ein Service. Für das Limit zählen alle nicht gelöschten CIs Ihrer Organisation, über alle Kunden, gleich ob die Discovery sie angelegt hat oder ein Mensch."
      - group: "Beleg : Was als CI zählt"
    - heading "Was passiert über dem Limit?" [level=3]
    - paragraph:
      - text: "Jedes CI über dem Limit Ihres Pakets kostet 0,05 € im Monat. Findet die Discovery über dem Limit ein neues Gerät, verwirft Reticora es nicht: Es wartet in der Review-Inbox als „Nicht lizenziertes CI“, bis es übernommen werden kann."
      - group: "Beleg : Zusatzkosten"
      - group: "Beleg : Neue Geräte über dem Limit"
    - heading "Was passiert nach dem Test?" [level=3]
    - paragraph:
      - text: Ihre CMDB bleibt nach dem Ende des Tests 30 Tage erhalten. Wählen Sie in dieser Zeit ein Paket, arbeiten Sie mit allen Daten weiter; sonst wird sie gelöscht.
      - group: "Beleg : Test und Downgrade"
    - heading "Was passiert, wenn ich in ein kleineres Paket wechsle?" [level=3]
    - paragraph:
      - text: Sie verlieren keine Daten. CIs über dem Limit des neuen Pakets werden als zusätzliche CIs berechnet. Funktionen, die das neue Paket nicht enthält, werden gesperrt; ihre Daten bleiben erhalten.
      - group: "Beleg : Test und Downgrade"
      - group: "Beleg : Zusatzkosten"
    - heading "Wie funktioniert der Beta-Rabatt?" [level=3]
    - paragraph:
      - text: In den ersten sechs Monaten zahlen Sie 20 % weniger, in den folgenden sechs Monaten 10 % weniger, danach den vollen Preis. Zahlen Sie jährlich im Voraus, gilt im ersten Jahr der Preis der Spalte „erstes Beta-Jahr“.
      - group: "Beleg : Paketumfang, Limits, Preise"
    - heading "Was unterscheidet Enterprise Shared und Enterprise Local?" [level=3]
    - paragraph:
      - text: Enterprise Shared läuft in der Cloud auf getrennter Infrastruktur. Enterprise Local wird bei Ihnen gehostet; der Preis enthält alle Arbeiten dafür.
      - group: "Beleg : Enterprise Shared und Enterprise Local"
    - heading "Was kosten IGA und der KI-Assistent?" [level=3]
    - paragraph: Beide Add-ons sind zu jedem Paket zubuchbar. Den Preis nennen wir auf Anfrage.
    - heading "Können Privatpersonen Reticora buchen?" [level=3]
    - paragraph: Nein. Das Angebot richtet sich nur an Unternehmen. Alle Preise verstehen sich zuzüglich Mehrwertsteuer.
