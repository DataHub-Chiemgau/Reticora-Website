  - region "Try for 30 days":
    - heading "Try for 30 days" [level=2]
    - paragraph:
      - text: The trial covers the Standard plan for up to 100 CIs. You create an account, confirm your email address and set up an authenticator app at your first sign-in. After the trial your CMDB is kept for 30 days; if you do not choose a plan by then, it is deleted.
      - group: "Evidence : Trial and downgrade"
    - link "Try for 30 days":
      - /url: https://www.reticora.cloud/onboarding
  - region "Questions about pricing and plans":
    - heading "Questions about pricing and plans" [level=2]
    - heading "What counts as a CI?" [level=3]
    - paragraph:
      - text: "A CI is an entry in the CMDB: a device, a virtual machine, a service. The limit counts every CI of your organization that is not deleted, across all customers, whether discovery created it or a person."
      - group: "Evidence : What counts as a CI"
    - heading "What happens above the limit?" [level=3]
    - paragraph:
      - text: "Each CI above your plan’s limit costs €0.05 per month. If discovery finds a new device above the limit, Reticora does not discard it: it waits in the review inbox as an “Unlicensed CI” until it can be added."
      - group: "Evidence : Additional charges"
      - group: "Evidence : New devices above the limit"
    - heading "What happens after the trial?" [level=3]
    - paragraph:
      - text: Your CMDB is kept for 30 days after the trial ends. If you choose a plan within that time, you keep working with all your data; otherwise it is deleted.
      - group: "Evidence : Trial and downgrade"
    - heading "What happens if I switch to a smaller plan?" [level=3]
    - paragraph:
      - text: You lose no data. CIs above the new plan’s limit are charged as additional CIs. Features the new plan does not include are locked; their data is kept.
      - group: "Evidence : Trial and downgrade"
      - group: "Evidence : Additional charges"
    - heading "How does the beta discount work?" [level=3]
    - paragraph:
      - text: In the first six months you pay 20% less, in the following six months 10% less, then the full price. If you pay yearly in advance, the price in the column “first beta year” applies in the first year.
      - group: "Evidence : Plan contents, limits and prices"
    - heading "What is the difference between Enterprise Shared and Enterprise Local?" [level=3]
    - paragraph:
      - text: Enterprise Shared runs in the cloud on separate infrastructure. Enterprise Local is hosted by you; the price includes all work for it.
      - group: "Evidence : Enterprise Shared and Enterprise Local"
    - heading "What do IGA and the AI assistant cost?" [level=3]
    - paragraph: Both add-ons can be added to any plan. The price is available on request.
    - heading "Can private individuals buy Reticora?" [level=3]
    - paragraph: No. The offer is for businesses only. All prices are exclusive of VAT.
